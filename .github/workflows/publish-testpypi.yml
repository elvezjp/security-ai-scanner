name: Publish to TestPyPI

# 手動実行で TestPyPI に配布物を公開し、本番リリース前に公開経路を検証する。
# 認証は Trusted Publisher (OIDC)。
#
# 事前準備 (管理者作業):
#   1. TestPyPI 側で elvezjp/security-ai-scanner と本 workflow を Trusted
#      Publisher として登録 (https://test.pypi.org/manage/account/publishing/)
#   2. GitHub リポ Settings → Environments → "testpypi" を作成
#
# 動作確認:
#   pip install --index-url https://test.pypi.org/simple/ \
#     --extra-index-url https://pypi.org/simple/ security-ai-scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run tests
        run: uv run pytest
      - name: Build sdist and wheel
        run: uv build
      - name: Generate locked runtime SBOM
        run: >-
          uv export --locked --no-dev --extra claude --extra mcp
          --format cyclonedx1.5 --output-file sbom.cdx.json
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sbom
          path: sbom.cdx.json

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/security-ai-scanner
    permissions:
      id-token: write # Trusted Publisher (OIDC) のために必要
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
